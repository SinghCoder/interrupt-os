<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920,height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root{--ink:#132019;--forest:#315f4d;--green:#74a58d;--mint:#dcebe2;--paper:#f4f6f1;--white:#fff;--amber:#b87820;--muted:#5c6b63;--line:#cbd8d0}
    *{box-sizing:border-box}
    html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
    #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 15% 48%,rgba(116,165,141,.16),transparent 34%),linear-gradient(135deg,#f8f9f5,#eef3ee)}
    #root:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(49,95,77,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(49,95,77,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(90deg,transparent,black 46%,black)}
    .scene-slot{position:absolute;inset:0;z-index:4}
    .phone-slot{position:absolute;inset:0;z-index:12;pointer-events:none}
    .device-video{position:absolute;left:127px;top:110px;width:402px;height:860px;object-fit:cover;object-position:center top;border-radius:48px;background:#edf1eb;z-index:10}
    .scene-root{position:absolute;inset:0;overflow:hidden}
    .scene-root.dark{background:linear-gradient(135deg,#132019,#183127);color:#fff}
    .brand{position:absolute;left:76px;top:54px;display:flex;align-items:center;gap:13px;font-weight:750;font-size:20px;letter-spacing:-.02em}
    .brand-dot{width:32px;height:32px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
    .brand-dot:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--mint)}
    .dark .brand-dot{background:#fff}.dark .brand-dot:after{background:var(--forest)}
    .status{position:absolute;right:76px;top:61px;color:var(--muted);font:700 13px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em}
    .status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:10px}
    .dark .status{color:var(--mint)}
    .copy{position:absolute;left:650px;right:92px;top:154px;bottom:90px;display:flex;flex-direction:column;justify-content:center}
    .eyebrow{color:var(--forest);font:750 14px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.15em;margin-bottom:20px}
    .dark .eyebrow{color:#a8cbb9}
    h1,h2,p{margin:0}
    h1{max-width:1100px;font-size:84px;line-height:.98;letter-spacing:-.055em;font-weight:650}
    h2{max-width:1080px;font-size:62px;line-height:1.02;letter-spacing:-.045em;font-weight:650}
    p{font-size:25px;line-height:1.42;color:var(--muted)}
    .dark p{color:#c9ddd2}
    .accent{color:var(--amber)}.green{color:var(--forest)}
    .definition{margin-top:34px;display:inline-flex;align-items:center;gap:14px;width:max-content;max-width:1000px;padding:16px 22px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.76);font-size:21px;font-weight:650}
    .definition b{width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:14px}
    .mini-flow{display:flex;align-items:center;gap:12px;margin-top:46px}
    .mini-card{padding:14px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:650;box-shadow:0 12px 30px rgba(19,32,25,.06)}
    .mini-arrow{color:var(--forest);font-size:25px;font-weight:800}
    .claim-card{margin-top:34px;width:760px;padding:26px 28px;border-radius:18px;background:#fff;border:1px solid var(--line);border-left:7px solid var(--amber);box-shadow:0 20px 50px rgba(19,32,25,.08)}
    .claim-card small{display:block;color:var(--forest);font:750 13px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
    .claim-card strong{display:block;font-size:31px;line-height:1.15}
    .claim-card span{display:block;color:var(--muted);font-size:19px;margin-top:8px}
    .question{margin-top:22px;display:flex;align-items:center;gap:15px;font-size:24px;font-weight:650;color:var(--forest)}
    .question i{font-style:normal;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff}
    .evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:30px;max-width:950px}
    .evidence{min-height:116px;padding:18px 20px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:16px}
    .evidence span{display:block;color:var(--muted);font:750 12px/1 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.11em;margin-bottom:12px}
    .evidence strong{font-size:31px;letter-spacing:-.035em}
    .decision{margin-top:18px;display:flex;align-items:center;gap:14px;width:max-content;padding:13px 18px;background:var(--mint);border-radius:999px;color:var(--forest);font-size:19px;font-weight:750}
    .decision b{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff}
    .feedback-card{margin-top:36px;width:820px;padding:26px;border-radius:20px;background:#fff;border:1px solid var(--line)}
    .feedback-card strong{font-size:28px}
    .feedback-actions{display:flex;gap:12px;margin-top:20px}
    .feedback-actions span{padding:13px 22px;border-radius:999px;background:var(--mint);color:var(--forest);font-size:18px;font-weight:750}
    .feedback-actions span:last-child{background:var(--ink);color:#fff}
    .loop-label{margin-top:22px;display:flex;align-items:center;gap:14px;color:var(--forest);font-size:21px;font-weight:700}
    .loop-label b{font-size:30px}
    .pass-path{margin-top:34px;display:flex;align-items:center;gap:16px}
    .pass-pill{padding:17px 22px;border:1px solid rgba(255,255,255,.22);border-radius:16px;font-size:19px;font-weight:700;background:rgba(255,255,255,.07)}
    .pass-pill.final{background:#dff3e7;color:#214b39;border-color:#dff3e7}
    .pass-arrow{font-size:28px;color:#a8cbb9}
    .arch-copy{position:absolute;left:610px;right:70px;top:122px}
    .arch-copy h2{font-size:52px}
    .arch-map{position:absolute;left:610px;top:275px;width:1220px;height:650px}
    .arch-node{position:absolute;width:330px;min-height:132px;padding:20px 22px;border-radius:18px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 14px 36px rgba(19,32,25,.06)}
    .arch-node b{display:block;color:#a26a1c;font:750 12px/1 ui-monospace,monospace;letter-spacing:.12em;margin-bottom:10px}
    .arch-node strong{display:block;font-size:23px;margin-bottom:7px}.arch-node span{display:block;color:var(--muted);font-size:16px;line-height:1.3}
    .n1{left:0;top:0}.n2{left:400px;top:0}.n3{left:800px;top:0}.n4{left:800px;top:270px}.n5{left:400px;top:270px}.n6{left:0;top:270px}
    .arch-node.serp{background:var(--forest);color:#fff;border-color:var(--forest)}.arch-node.serp span{color:#dcebe2}.arch-node.serp b{color:#f8e2be}
    .arch-node.action{background:var(--ink);color:#fff;border-color:var(--ink)}.arch-node.action span{color:#c9ddd2}.arch-node.action b{color:#f8e2be}
    .arch-lines{position:absolute;inset:0;overflow:visible;pointer-events:none}
    .arch-lines path{fill:none;stroke:#9bb8aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:var(--amber);filter:drop-shadow(0 0 8px rgba(184,120,32,.55))}
    .feedback-loop{position:absolute;left:395px;top:485px;padding:13px 18px;border:1px dashed var(--green);border-radius:999px;color:var(--forest);font-size:16px;font-weight:750;background:rgba(244,246,241,.92)}
    .tech-line{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px;max-width:1100px}
    .tech-line span{padding:11px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font:700 14px/1 ui-monospace,monospace;color:var(--forest)}
    .final-rule{margin-top:42px;font-size:31px;font-weight:750;letter-spacing:-.025em}.final-rule .sep{color:var(--forest);margin:0 12px}
    .scene-time{position:absolute;right:76px;bottom:46px;color:var(--muted);font:700 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
    .dark .scene-time{color:#a8cbb9}
    .phone-shell{position:absolute;left:110px;top:92px;width:436px;height:896px;border-radius:58px;border:14px solid #111a15;box-shadow:0 34px 85px rgba(19,32,25,.21)}
    .phone-shell:before{content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:120px;height:24px;border-radius:0 0 18px 18px;background:#111a15}
    .phone-shell:after{content:"LIVE PRODUCT";position:absolute;left:50%;bottom:-43px;transform:translateX(-50%);color:var(--muted);font:750 11px/1 ui-monospace,monospace;letter-spacing:.16em;white-space:nowrap}
  </style>
</head>
